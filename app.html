<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0A0A0A"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PARKEA"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));}</script>
  <title>PARKEA</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0A0A0A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;}

    /* Screens */
    .screen{flex:1;overflow-y:auto;padding:0 16px 90px;display:none;}
    .screen.active{display:block;}

    /* ── MAGIC TAB BAR ── */
    .tabbar{
      position:fixed;bottom:0;left:0;right:0;
      background:#111111;
      border-top:1px solid #1E1E1E;
      padding:6px 8px 28px;
      z-index:100;
    }
    .tab-row{
      display:flex;align-items:flex-end;justify-content:space-around;
    }
    /* Tab normal */
    .tb{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding-top:6px;gap:3px;cursor:pointer;position:relative;min-height:46px;
    }
    /* Píldora degradado detrás del ícono activo */
    .tb.active::before{
      content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:52px;height:40px;border-radius:14px;
      background:linear-gradient(135deg,#A8E063,#56CCF2);
      z-index:0;
    }
    .tb-icon{
      position:relative;z-index:1;
      width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    }
    .tb-icon svg{width:22px;height:22px;fill:none;stroke:#444;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .tb.active .tb-icon svg{stroke:#FFFFFF;}
    .tb-label{font-size:10px;color:#444;letter-spacing:0.2px;position:relative;z-index:1;}
    .tb.active .tb-label{display:none;}/* sin texto cuando activo */
    .tb-dot{width:4px;height:4px;border-radius:2px;background:#A8E063;display:none;}
    .tb.active .tb-dot{display:block;}

    /* Botón scan central — siempre degradado */
    .tb-scan{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;margin-bottom:6px;gap:3px;
    }
    .tb-scan-btn{
      width:54px;height:54px;border-radius:16px;
      background:linear-gradient(135deg,#A8E063,#56CCF2);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 16px #56CCF244;
    }
    .tb-scan-btn svg{width:24px;height:24px;fill:none;stroke:#0A0A0A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .tb-scan-lbl{font-size:10px;color:#444;letter-spacing:0.2px;}

    /* Header */
    .header{display:flex;justify-content:space-between;align-items:center;padding:56px 0 16px;}
    .h-sub{color:#555;font-size:10px;letter-spacing:2px;text-transform:uppercase;}
    .h-title{color:#FFF;font-size:22px;font-weight:800;margin-top:2px;}
    .avatar{width:42px;height:42px;border-radius:21px;background:#FFE118;display:flex;align-items:center;justify-content:center;color:#0A0A0A;font-size:16px;font-weight:900;cursor:pointer;flex-shrink:0;}

    /* Cards */
    .card{background:#1A1A1A;border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid #2C2C2C;}
    .row{display:flex;justify-content:space-between;align-items:flex-start;}
    .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1E1E1E;}
    .info-row:last-child{border:none;}
    .info-key{font-size:12px;color:#555;}
    .info-val{font-size:12px;font-weight:600;color:#FFF;}
    .section-lbl{color:#555;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}

    /* Badges */
    .badge{border-radius:10px;padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:1px;}

    /* ── HOME ── */
    .avail-card{background:#1A1A1A;border-radius:20px;padding:18px;border-width:1.5px;border-style:solid;margin-bottom:16px;}
    .avail-num{font-size:48px;font-weight:900;line-height:1.1;margin-top:4px;}
    .avail-total{font-size:18px;font-weight:400;color:#555;}
    .prog-bg{background:#111;border-radius:5px;height:6px;overflow:hidden;margin-top:12px;}
    .prog-fill{height:100%;border-radius:5px;transition:width 0.5s;}
    .realtime{color:#333;font-size:9px;margin-top:6px;text-align:right;letter-spacing:1.5px;text-transform:uppercase;}
    .flow-card{background:#1A1A1A;border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid #1C6EF722;}
    .flow-title{color:#1C6EF7;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;}
    .step{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
    .step:last-child{margin-bottom:0;}
    .step-num{width:24px;height:24px;min-width:24px;border-radius:8px;background:#1C6EF718;border:1px solid #1C6EF733;display:flex;align-items:center;justify-content:center;color:#1C6EF7;font-size:11px;font-weight:800;}
    .step-title{color:#FFF;font-size:12px;font-weight:600;}
    .step-desc{color:#555;font-size:10px;margin-top:2px;line-height:15px;}
    .fares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
    .fare-cell{background:#1A1A1A;border-radius:14px;padding:12px 8px;text-align:center;border:1.5px solid #2C2C2C;}
    .fare-amt{font-size:18px;font-weight:900;}
    .fare-unit{color:#FFF;font-size:9px;margin-top:2px;}
    .fare-lbl{color:#555;font-size:9px;margin-top:2px;}
    .fine-card{background:#1A0808;border-radius:14px;padding:14px;border:1px solid #FF444422;display:flex;align-items:center;gap:12px;margin-bottom:8px;}
    .fine-icon{width:28px;height:28px;min-width:28px;border-radius:14px;background:#FF444418;border:1px solid #FF444444;display:flex;align-items:center;justify-content:center;color:#FF4444;font-weight:900;font-size:14px;}
    .fine-txt{color:#FF4444;font-size:12px;font-weight:700;}
    .fine-desc{color:#555;font-size:10px;margin-top:2px;}

    /* ── TICKET ── */
    .timer-card{background:#202020;border-radius:20px;padding:18px;border:1.5px solid #FFE11833;margin-bottom:14px;text-align:center;box-shadow:0 0 32px #FFE11811;}
    .timer-lbl{font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
    .timer-txt{color:#FFE118;font-size:46px;font-weight:900;font-family:'Courier New',monospace;letter-spacing:-2px;line-height:1;}
    .courtesy-badge{background:#00C85322;border:1px solid #00C85344;border-radius:8px;padding:5px 12px;display:inline-block;font-size:11px;color:#00C853;font-weight:700;margin-bottom:12px;}
    .cost-row-t{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:12px;}
    .cost-lbl-t{font-size:12px;color:#555;}
    .cost-val-t{font-size:26px;font-weight:800;}
    .breakdown-t{color:#555;font-size:10px;margin-top:6px;letter-spacing:0.5px;}
    .prog-bg-t{background:#181818;border-radius:5px;height:5px;overflow:hidden;width:100%;margin-top:12px;}
    .prog-fill-t{height:100%;border-radius:5px;background:#FFE118;}

    /* ── PAY ── */
    .summary-card{background:#202020;border-radius:18px;padding:16px;margin-bottom:14px;border:1.5px solid #FFE11833;}
    .total-row{display:flex;justify-content:space-between;align-items:center;padding-top:12px;}
    .total-lbl{color:#FFF;font-size:14px;font-weight:700;}
    .total-val{font-size:22px;font-weight:900;}
    .card-indicator{display:flex;align-items:center;gap:14px;background:#1A1A1A;border-radius:14px;padding:16px;margin-bottom:14px;border:1.5px solid #1C6EF733;}
    .pay-form{background:#1A1A1A;border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid #2C2C2C;}
    .field{margin-bottom:12px;}
    .field label{display:block;color:#888;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
    .field input{width:100%;background:#111;border:1.5px solid #2C2C2C;border-radius:12px;padding:14px;color:#FFF;font-size:14px;font-weight:600;outline:none;-webkit-appearance:none;}
    .field input:focus{border-color:#FFE118;}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .secure-note{color:#333;font-size:10px;text-align:center;margin-top:8px;}
    .free-banner{background:#00C85312;border-radius:14px;padding:24px;margin-bottom:14px;border:1.5px solid #00C85333;text-align:center;}

    /* QR salida */
    .qr-card{background:#1A1A1A;border-radius:20px;padding:20px;margin-bottom:14px;border:1px solid #2C2C2C;text-align:center;}
    .qr-lbl{color:#555;font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
    .qr-wrap{background:#FFF;border-radius:12px;padding:10px;display:inline-block;margin-bottom:12px;}
    .qr-token{color:#FFE118;font-size:14px;font-weight:700;letter-spacing:2px;}
    .qr-sub{color:#555;font-size:11px;margin-top:6px;}
    .success-banner{display:flex;align-items:center;gap:14px;background:#00C85312;border-radius:14px;padding:16px;margin-bottom:14px;border:1.5px solid #00C85333;}
    .success-icon{width:40px;height:40px;min-width:40px;border-radius:20px;background:#00C85322;border:1.5px solid #00C853;display:flex;align-items:center;justify-content:center;color:#00C853;font-size:20px;font-weight:900;}

    /* Historial */
    .hist-item{background:#1A1A1A;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid #2C2C2C;display:flex;justify-content:space-between;align-items:center;}
    .hist-token{color:#1C6EF7;font-size:12px;font-weight:700;}
    .hist-date{color:#555;font-size:11px;margin-top:2px;}
    .hist-amount{color:#FFE118;font-size:14px;font-weight:800;text-align:right;}
    .hist-status{font-size:10px;font-weight:700;margin-top:2px;text-align:right;}

    /* Config */
    .config-section{background:#1A1A1A;border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid #2C2C2C;}
    .config-title{color:#555;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
    .profile-row{display:flex;align-items:center;gap:14px;}
    .profile-avatar{width:52px;height:52px;border-radius:26px;background:#FFE118;display:flex;align-items:center;justify-content:center;color:#0A0A0A;font-size:20px;font-weight:900;flex-shrink:0;}

    /* Buttons */
    .btn{width:100%;padding:15px;border-radius:16px;border:none;font-size:15px;font-weight:900;cursor:pointer;margin-bottom:10px;text-align:center;display:block;}
    .btn-yellow{background:#FFE118;color:#0A0A0A;box-shadow:0 0 22px #FFE11844;}
    .btn-yellow:disabled{background:#333;color:#666;box-shadow:none;cursor:not-allowed;}
    .btn-outline{background:transparent;color:#FFF;border:1px solid #2C2C2C;}
    .btn-red{background:transparent;color:#FF4444;border:1.5px solid #FF444433;}

    /* Utils */
    .error-box{background:#FF444415;border-radius:10px;border:1px solid #FF444433;padding:12px;margin-bottom:12px;color:#FF4444;font-size:12px;text-align:center;display:none;}
    .success-box{background:#00C85315;border-radius:10px;border:1px solid #00C85333;padding:12px;margin-bottom:12px;color:#00C853;font-size:12px;text-align:center;display:none;}
    .empty-state{text-align:center;padding:56px 20px;}
    .empty-icon{width:64px;height:64px;border-radius:32px;background:#FFE11822;border:1.5px solid #FFE11844;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#FFE118;font-size:24px;font-weight:900;}
    .empty-title{color:#FFF;font-size:18px;font-weight:700;margin-bottom:8px;}
    .empty-sub{color:#555;font-size:13px;line-height:20px;}
    .spinner-sm{width:18px;height:18px;border:2px solid #0A0A0A44;border-top:2px solid #0A0A0A;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle;}
    .spinner-lg{width:36px;height:36px;border:3px solid #222;border-top:3px solid #FFE118;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
    .loading-wrap{text-align:center;padding:48px 20px;}
    .loading-wrap p{color:#555;font-size:13px;margin-top:12px;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>

<!-- ══ HOME ══ -->
<div id="screen-home" class="screen active">
  <div class="header">
    <div><div class="h-sub">Bienvenida</div><div class="h-title" id="home-name">—</div></div>
    <div class="avatar" onclick="goTab('config')">?</div>
  </div>
  <div id="home-content"></div>
</div>

<!-- ══ TICKET ══ -->
<div id="screen-ticket" class="screen">
  <div id="ticket-content"></div>
</div>

<!-- ══ SCAN ══ -->
<div id="screen-scan" class="screen">
  <div class="header">
    <div><div class="h-sub">Panel de acceso</div><div class="h-title">Escanear <span style="color:#FFE118">QR</span></div></div>
    <div class="avatar" onclick="goTab('config')">?</div>
  </div>
  <div id="scan-content"></div>
</div>

<!-- ══ HISTORIAL ══ -->
<div id="screen-history" class="screen">
  <div class="header">
    <div><div class="h-sub">Mis visitas</div><div class="h-title">Historial</div></div>
    <div class="avatar" onclick="goTab('config')">?</div>
  </div>
  <div id="history-content"></div>
</div>

<!-- ══ PAY ══ -->
<div id="screen-pay" class="screen">
  <div id="pay-content"></div>
</div>

<!-- ══ CONFIG (settings) ══ -->
<div id="screen-config" class="screen">
  <div class="header">
    <div><div class="h-sub">Mi cuenta</div><div class="h-title">Configuración</div></div>
  </div>
  <div id="config-content"></div>
</div>

<!-- ══ MAGIC TAB BAR ══ -->
<nav class="tabbar">
  <div class="tab-row">

    <!-- Inicio -->
    <div class="tb active" id="tb-home" onclick="goTab('home')">
      <div class="tb-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      </div>
      <div class="tb-label">Inicio</div>
      <div class="tb-dot"></div>
    </div>

    <!-- Ticket -->
    <div class="tb" id="tb-ticket" onclick="goTab('ticket')">
      <div class="tb-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v5M15 4v5"/></svg>
      </div>
      <div class="tb-label">Ticket</div>
      <div class="tb-dot"></div>
    </div>

    <!-- Scan central -->
    <div class="tb-scan" id="tb-scan" onclick="goTab('scan')">
      <div class="tb-scan-btn">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h3M17 4h3v3M4 17v3h3M17 20h3v-3M8 8h1v1H8zM11 8h1v1h-1zM14 8h1v1h-1zM8 11h1v1H8zM11 11h1v1h-1zM14 11h1v1h-1zM8 14h1v1H8zM11 14h1v1h-1zM14 14h1v1h-1z"/></svg>
      </div>
      <div class="tb-scan-lbl">Escanear</div>
    </div>

    <!-- Historial -->
    <div class="tb" id="tb-history" onclick="goTab('history')">
      <div class="tb-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </div>
      <div class="tb-label">Historial</div>
      <div class="tb-dot"></div>
    </div>

    <!-- Pagar -->
    <div class="tb" id="tb-pay" onclick="goTab('pay')">
      <div class="tb-icon">
        <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
      </div>
      <div class="tb-label">Pagar</div>
      <div class="tb-dot"></div>
    </div>

  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ══════════════════════════════════════
// SESIÓN
// ══════════════════════════════════════
const SUPABASE_URL  = 'https://pjpquwrrmjfzdcicvssm.supabase.co';
const SUPABASE_ANON = 'sb_publishable_vDACoUwPW_ql0KAtqXXF6g_hQbbFdn3';
const PAYMENT_URL   = `${SUPABASE_URL}/functions/v1/process-payment`;
const COURTESY=15, FIRST=15, EXTRA=20;

let SESSION=null;
try{ const s=JSON.parse(localStorage.getItem('parkea_session')||'null'); if(s&&s.access_token&&s.expires_at>Date.now()/1000)SESSION=s; }catch(e){}
if(!SESSION){ window.location.href='index.html'; }

const USER=SESSION.user;
const userName=USER?.user_metadata?.full_name||USER?.email?.split('@')[0]||'?';
const userInitial=userName.charAt(0).toUpperCase();
document.querySelectorAll('.avatar').forEach(a=>a.textContent=userInitial);
document.getElementById('home-name').textContent=userName;

function authH(){ return{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SESSION.access_token}`,'Content-Type':'application/json'}; }
function pad(n){ return String(n).padStart(2,'0'); }
function calcCost(m){ if(m<=COURTESY)return 0; const b=Math.ceil((m-COURTESY)/60); return FIRST+Math.max(0,b-1)*EXTRA; }
function mSince(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/60000); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }
function loadingEl(id){ document.getElementById(id).innerHTML=`<div class="loading-wrap"><div class="spinner-lg"></div><p>Cargando...</p></div>`; }

// ══════════════════════════════════════
// NAVEGACIÓN
// ══════════════════════════════════════
let currentTab='home';
let ticketInterval=null;
let spotsInterval=null;
let currentTicket=null;

const TAB_SCREENS=['home','ticket','scan','history','pay','config'];

function goTab(tab){
  // Limpiar intervalos al salir
  if(currentTab==='home' && tab!=='home' && spotsInterval){ clearInterval(spotsInterval); spotsInterval=null; }

  TAB_SCREENS.forEach(t=>{
    document.getElementById('screen-'+t).classList.remove('active');
    const el=document.getElementById('tb-'+t);
    if(el) el.classList.remove('active');
  });

  document.getElementById('screen-'+tab).classList.add('active');
  const tbEl=document.getElementById('tb-'+tab);
  if(tbEl) tbEl.classList.add('active');
  currentTab=tab;

  if(tab==='home')    loadHome();
  if(tab==='ticket')  loadTicket();
  if(tab==='scan')    loadScan();
  if(tab==='history') loadHistory();
  if(tab==='pay')     loadPay();
  if(tab==='config')  loadConfig();
}

// ══════════════════════════════════════
// HOME — igual que home.tsx
// ══════════════════════════════════════
let spots=34;
function loadHome(){
  renderHome();
  if(spotsInterval) clearInterval(spotsInterval);
  spotsInterval=setInterval(()=>{
    spots=Math.max(10,Math.min(50,spots+Math.floor(Math.random()*3)-1));
    const pct=(spots/50)*100;
    const c=pct>55?'#00C853':pct>25?'#FF8C00':'#FF4444';
    const el=document.getElementById('sn'); if(el){el.textContent=spots;el.style.color=c;}
    const pf=document.getElementById('sp'); if(pf){pf.style.width=pct+'%';pf.style.background=c;}
    const bl=document.getElementById('sb');
    if(bl){bl.textContent=pct>55?'DISPONIBLE':pct>25?'CASI LLENO':'MUY LLENO';bl.style.color=c;bl.style.borderColor=c+'55';bl.style.background=c+'22';}
    const ac=document.getElementById('ac');
    if(ac){ac.style.borderColor=c+'44';ac.style.boxShadow=`0 0 24px ${c}18`;}
  },2800);
}

function renderHome(){
  const pct=(spots/50)*100;
  const c=pct>55?'#00C853':pct>25?'#FF8C00':'#FF4444';
  const lbl=pct>55?'DISPONIBLE':pct>25?'CASI LLENO':'MUY LLENO';
  document.getElementById('home-content').innerHTML=`
    <div class="avail-card" id="ac" style="border-color:${c}44;box-shadow:0 0 24px ${c}18;">
      <div class="row">
        <div>
          <div class="section-lbl">Cajones disponibles</div>
          <div class="avail-num"><span id="sn" style="color:${c}">${spots}</span><span class="avail-total">/50</span></div>
        </div>
        <div class="badge" id="sb" style="background:${c}22;border:1.5px solid ${c}55;color:${c}">${lbl}</div>
      </div>
      <div class="prog-bg"><div class="prog-fill" id="sp" style="width:${pct}%;background:${c}"></div></div>
      <div class="realtime">En tiempo real</div>
    </div>
    <div class="flow-card">
      <div class="flow-title">Flujo del servicio</div>
      <div class="step"><div class="step-num">1</div><div><div class="step-title">Escanea el QR en el tótem</div><div class="step-desc">Tu navegador abre el boleto provisional automáticamente</div></div></div>

function startTimer(ticket){
  if(ticketInterval)clearInterval(ticketInterval);
  function update(){
    const secs=Math.floor((Date.now()-new Date(ticket.entry_at).getTime())/1000);
    const mins=Math.floor(secs/60);
    const hh=Math.floor(mins/60);
    const el=document.getElementById('t-timer'); if(el)el.textContent=`${pad(hh)}:${pad(mins%60)}:${pad(secs%60)}`;
    const cost=calcCost(mins);
    const costEl=document.getElementById('t-cost'); if(costEl){costEl.textContent=`$${cost}`;costEl.style.color=mins<=COURTESY?'#00C853':'#FFF';}
    const cw=document.getElementById('t-courtesy-wrap');
    if(cw) cw.innerHTML=mins<=COURTESY?`<div class="courtesy-badge">Cortesía — ${COURTESY-mins} min gratis restantes</div>`:'';
    const bd=document.getElementById('t-breakdown');
    if(bd) bd.textContent=cost>0?`1 hr × $${FIRST}.00 MXN${cost>FIRST?' + '+Math.round((cost-FIRST)/EXTRA)+' hrs extra × $'+EXTRA+'.00 MXN':''}`:'' ;
    const pEl=document.getElementById('t-prog'); if(pEl)pEl.style.width=Math.min(100,(secs/5400)*100)+'%';
    const btn=document.getElementById('btn-pay-now'); if(btn)btn.textContent=cost>0?`Pagar ahora — $${cost} MXN`:'Salida gratuita (cortesía)';
  }
  update();
  ticketInterval=setInterval(update,1000);
}

function fmtCard(el){ el.value=el.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim(); }
function fmtExp(el){ const c=el.value.replace(/\D/g,'').slice(0,4); el.value=c.length>=3?c.slice(0,2)+'/'+c.slice(2):c; }
function chkPay(){
  const num=(document.getElementById('p-num')?.value||'').replace(/\s/g,'');
  const name=(document.getElementById('p-name')?.value||'').trim();
  const exp=(document.getElementById('p-exp')?.value||'');
  const cvv=(document.getElementById('p-cvv')?.value||'');
  const [month]=(exp||'/').split('/');
  const ok=num.length===16&&name.length>2&&exp.length===5&&parseInt(month)>=1&&parseInt(month)<=12&&cvv.length>=3;
  const btn=document.getElementById('btn-confirm');
  if(btn){btn.disabled=!ok; const cost=calcCost(mSince(currentTicket.entry_at)); btn.textContent=ok?`CONFIRMAR PAGO · $${cost} MXN`:'Completa los datos de tarjeta';}
}

async function confirmPay(){
  const btn=document.getElementById('btn-confirm');
  const errEl=document.getElementById('pay-err');
  errEl.style.display='none'; btn.disabled=true; btn.innerHTML='<span class="spinner-sm"></span> Procesando...';
  try{
    const res=await fetch(PAYMENT_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SESSION.access_token}`},body:JSON.stringify({ticketId:currentTicket.id,paymentMethod:'app'})});
    const json=await res.json();
    if(!res.ok){errEl.textContent=json.error??'Error al procesar pago';errEl.style.display='block';btn.disabled=false;chkPay();return;}
    const r2=await fetch(`${SUPABASE_URL}/rest/v1/tickets?id=eq.${currentTicket.id}&select=*`,{headers:authH()});
    const d2=await r2.json(); currentTicket=d2[0]??currentTicket;
    goTab('ticket');
  }catch(e){errEl.textContent='Error de conexión';errEl.style.display='block';btn.disabled=false;chkPay();}
}

// ══════════════════════════════════════
// HISTORIAL — con rango de fechas y filtro por mes
// ══════════════════════════════════════
const STATUS_COLOR_H = {active:'#00C853',paid:'#1C6EF7',exited:'#00C853',fined:'#FF4444'};
const STATUS_LABEL_H = {active:'Activo',paid:'Pagado',exited:'Completado',fined:'Multado'};

let allTickets = [];
let histRangeFrom = '';
let histRangeTo   = '';
let histMonth     = 'all';

function initHistDates(){
  const now = new Date();
  histRangeTo   = now.toISOString().split('T')[0];
  const first   = new Date(now.getFullYear(), now.getMonth(), 1);
  histRangeFrom = first.toISOString().split('T')[0];
}

function getMonthOptions(){
  const opts = [{v:'all',l:'Todos los meses'}];
  const now = new Date();
  for(let i=0;i<12;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const v = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const l = d.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    opts.push({v, l: l.charAt(0).toUpperCase()+l.slice(1)});
  }
  return opts;
}

function fmtDuration(entryAt, paidAt){
  const end = paidAt ? new Date(paidAt).getTime() : Date.now();
  const mins = Math.floor((end - new Date(entryAt).getTime())/60000);
  if(mins < 60) return `${mins} min`;
  return `${Math.floor(mins/60)}h ${mins%60}m`;
}

function fmtDateLabel(iso){
  const d = new Date(iso);
  const today = new Date();
  const yest  = new Date(today); yest.setDate(today.getDate()-1);
  if(d.toDateString()===today.toDateString()) return 'Hoy';
  if(d.toDateString()===yest.toDateString())  return 'Ayer';
  return d.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'});
}

async function loadHistory(){
  if(!histRangeFrom) initHistDates();
  loadingEl('history-content');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/tickets?user_id=eq.${USER.id}&order=entry_at.desc&limit=100`,{headers:authH()});
  allTickets = await res.json() || [];
  renderHistory();
}

function renderHistory(){
  // Lista filtrada por mes
  const list = allTickets.filter(t => {
    if(histMonth === 'all') return true;
    return t.entry_at.slice(0,7) === histMonth;
  });

  // Stats filtradas por rango
  const range = allTickets.filter(t => {
    const d = t.entry_at.split('T')[0];
    return d >= histRangeFrom && d <= histRangeTo && (t.status==='paid'||t.status==='exited');
  });
  const totalSpent = range.reduce((s,t)=>s+(t.amount_mxn||0),0);
  const avgMins = range.length > 0
    ? Math.round(range.reduce((s,t)=>{
        const end = t.paid_at ? new Date(t.paid_at).getTime() : Date.now();
        return s + (end - new Date(t.entry_at).getTime())/60000;
      },0) / range.length)
    : 0;
  const avgLabel = avgMins<60 ? `${avgMins} min` : `${Math.floor(avgMins/60)}h ${avgMins%60}m`;

  const monthOpts = getMonthOptions();
  const monthLabel = monthOpts.find(o=>o.v===histMonth)?.l || 'Todos los meses';
  const fromLabel  = new Date(histRangeFrom).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
  const toLabel    = new Date(histRangeTo).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});

  const listHtml = list.length === 0
    ? `<div class="empty-state"><div class="empty-icon">🕐</div><div class="empty-title">Sin visitas</div><div class="empty-sub">No hay visitas en este periodo</div></div>`
    : list.map(t => {
        const sc = STATUS_COLOR_H[t.status]||'#555';
        const sl = STATUS_LABEL_H[t.status]||t.status;
        return `
        <div style="background:#1A1A1A;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid #2C2C2C;display:flex;align-items:center;gap:12px;">
          <div style="width:44px;height:44px;min-width:44px;border-radius:12px;background:${sc}22;border:1.5px solid ${sc}66;display:flex;align-items:center;justify-content:center;">
            <span style="color:${sc};font-size:18px;font-weight:900;">P</span>
          </div>
          <div style="flex:1;">
            <div style="color:#FFF;font-size:14px;font-weight:700;">Cajón ${t.spot_id||'—'}</div>
            <div style="color:#555;font-size:11px;margin-top:2px;">${fmtDateLabel(t.entry_at)} ${fmtTime(t.entry_at)} · ${fmtDuration(t.entry_at,t.paid_at)}</div>
          </div>
          <div style="text-align:right;">
            <div style="color:${t.status==='fined'?'#FF4444':'#FFE118'};font-size:14px;font-weight:800;">$${t.amount_mxn||0} MXN</div>
            <div style="background:${sc}22;border:1px solid ${sc}44;border-radius:8px;padding:3px 8px;margin-top:4px;display:inline-block;">
              <span style="color:${sc};font-size:10px;font-weight:700;">${sl}</span>
            </div>
          </div>
        </div>`;
      }).join('');

  document.getElementById('history-content').innerHTML = `
    <!-- Selector rango -->
    <div style="background:#1A1A1A;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #2C2C2C;">
      <div style="color:#555;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;">Rango de análisis</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex:1;background:#111;border-radius:12px;padding:12px;border:1px solid #2C2C2C;cursor:pointer;" onclick="showDatePicker('from')">
          <div style="color:#555;font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;">Desde</div>
          <div style="color:#FFF;font-size:12px;font-weight:700;">${fromLabel}</div>
        </div>
        <div style="color:#555;font-size:16px;">→</div>
        <div style="flex:1;background:#111;border-radius:12px;padding:12px;border:1px solid #2C2C2C;cursor:pointer;" onclick="showDatePicker('to')">
          <div style="color:#555;font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;">Hasta</div>
          <div style="color:#FFF;font-size:12px;font-weight:700;">${toLabel}</div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      <div style="background:#1A1A1A;border-radius:16px;padding:14px;border:1.5px solid #FFE11844;">
        <div style="color:#FFE118;font-size:28px;font-weight:900;line-height:1.1;">$${totalSpent}</div>
        <div style="color:#FFF;font-size:11px;font-weight:700;margin-top:4px;">Gastado</div>
        <div style="color:#555;font-size:10px;margin-top:2px;">MXN este periodo</div>
      </div>
      <div style="background:#1A1A1A;border-radius:16px;padding:14px;border:1.5px solid #1C6EF744;">
        <div style="color:#1C6EF7;font-size:28px;font-weight:900;line-height:1.1;">${range.length>0?avgLabel:'—'}</div>
        <div style="color:#FFF;font-size:11px;font-weight:700;margin-top:4px;">Tiempo prom.</div>
        <div style="color:#555;font-size:10px;margin-top:2px;">por visita</div>
      </div>
    </div>

    <!-- Filtro mes -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="color:#555;font-size:10px;letter-spacing:2px;text-transform:uppercase;">Últimas visitas</div>
      <div style="display:flex;align-items:center;gap:6px;background:#1A1A1A;border-radius:10px;padding:7px 12px;border:1px solid #2C2C2C;cursor:pointer;" onclick="showMonthPicker()">
        <span style="color:#FFF;font-size:12px;font-weight:600;">${monthLabel}</span>
        <span style="color:#555;font-size:12px;">▾</span>
      </div>
    </div>

    ${listHtml}

    <!-- Modal fecha -->
    <div id="date-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000000AA;z-index:200;align-items:center;justify-content:center;padding:24px;">
      <div style="background:#1A1A1A;border-radius:20px;padding:20px;border:1px solid #2C2C2C;width:100%;max-width:400px;">
        <div style="color:#FFF;font-size:16px;font-weight:800;margin-bottom:16px;" id="date-modal-title">Seleccionar fecha</div>
        <div id="date-modal-body"></div>
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button onclick="closeDatePicker()" style="flex:1;padding:14px;border-radius:12px;border:none;background:#2C2C2C;color:#FFF;font-weight:700;cursor:pointer;">Cancelar</button>
          <button onclick="confirmDate()" style="flex:1;padding:14px;border-radius:12px;border:none;background:#FFE118;color:#0A0A0A;font-weight:900;cursor:pointer;">Confirmar</button>
        </div>
      </div>
    </div>

    <!-- Modal mes -->
    <div id="month-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000000AA;z-index:200;align-items:center;justify-content:center;padding:24px;">
      <div style="background:#1A1A1A;border-radius:20px;padding:20px;border:1px solid #2C2C2C;width:100%;max-width:400px;">
        <div style="color:#FFF;font-size:16px;font-weight:800;margin-bottom:16px;">Filtrar por mes</div>
        <div style="max-height:300px;overflow-y:auto;">
          ${monthOpts.map(o=>`
            <div onclick="selectMonth('${o.v}')" style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #2C2C2C;cursor:pointer;background:${histMonth===o.v?'#FFE11808':'transparent'}">
              <span style="color:${histMonth===o.v?'#FFE118':'#FFF'};font-size:14px;">${o.l}</span>
              ${histMonth===o.v?'<span style="color:#FFE118">✓</span>':''}
            </div>`).join('')}
        </div>
        <button onclick="closeMonthPicker()" style="width:100%;padding:14px;border-radius:12px;border:none;background:#2C2C2C;color:#FFF;font-weight:700;cursor:pointer;margin-top:12px;">Cerrar</button>
      </div>
    </div>`;
}

let datePickerTarget = 'from';
let dpYear=2026, dpMonth=1, dpDay=1;

function showDatePicker(target){
  datePickerTarget = target;
  const val = target==='from' ? histRangeFrom : histRangeTo;
  const [y,m,d] = val.split('-').map(Number);
  dpYear=y; dpMonth=m; dpDay=d;
  document.getElementById('date-modal-title').textContent = target==='from'?'Fecha desde':'Fecha hasta';
  renderDatePickerBody();
  document.getElementById('date-modal').style.display='flex';
}

function renderDatePickerBody(){
  const years=[2025,2026,2027];
  const months=[{v:1,l:'Ene'},{v:2,l:'Feb'},{v:3,l:'Mar'},{v:4,l:'Abr'},{v:5,l:'May'},{v:6,l:'Jun'},{v:7,l:'Jul'},{v:8,l:'Ago'},{v:9,l:'Sep'},{v:10,l:'Oct'},{v:11,l:'Nov'},{v:12,l:'Dic'}];
  const daysInMonth = new Date(dpYear, dpMonth, 0).getDate();
  document.getElementById('date-modal-body').innerHTML=`
    <div style="color:#555;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Año</div>
    <div style="display:flex;gap:6px;margin-bottom:14px;">
      ${years.map(yr=>`<button onclick="dpYear=${yr};renderDatePickerBody()" style="flex:1;padding:8px;border-radius:10px;border:1px solid ${dpYear===yr?'#FFE11888':'#2C2C2C'};background:${dpYear===yr?'#FFE11822':'#111'};color:${dpYear===yr?'#FFE118':'#555'};font-weight:700;cursor:pointer;">${yr}</button>`).join('')}
    </div>
    <div style="color:#555;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Mes</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
      ${months.map(mo=>`<button onclick="dpMonth=${mo.v};renderDatePickerBody()" style="padding:7px 10px;border-radius:10px;border:1px solid ${dpMonth===mo.v?'#FFE11888':'#2C2C2C'};background:${dpMonth===mo.v?'#FFE11822':'#111'};color:${dpMonth===mo.v?'#FFE118':'#555'};font-weight:600;cursor:pointer;">${mo.l}</button>`).join('')}
    </div>
    <div style="color:#555;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Día</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      ${Array.from({length:daysInMonth},(_,i)=>i+1).map(dy=>`<button onclick="dpDay=${dy};renderDatePickerBody()" style="width:36px;height:36px;border-radius:10px;border:1px solid ${dpDay===dy?'#FFE11888':'#2C2C2C'};background:${dpDay===dy?'#FFE11822':'#111'};color:${dpDay===dy?'#FFE118':'#555'};font-weight:600;cursor:pointer;">${dy}</button>`).join('')}
    </div>`;
}

function confirmDate(){
  const val=`${dpYear}-${String(dpMonth).padStart(2,'0')}-${String(dpDay).padStart(2,'0')}`;
  if(datePickerTarget==='from') histRangeFrom=val;
  else histRangeTo=val;
  closeDatePicker();
  renderHistory();
}

function closeDatePicker(){ document.getElementById('date-modal').style.display='none'; }

function showMonthPicker(){ document.getElementById('month-modal').style.display='flex'; }
function closeMonthPicker(){ document.getElementById('month-modal').style.display='none'; }
function selectMonth(v){ histMonth=v; closeMonthPicker(); renderHistory(); }

// ══════════════════════════════════════
// CONFIG — igual que settings.tsx
// ══════════════════════════════════════
function loadConfig(){
  document.getElementById('config-content').innerHTML=`
    <div class="config-section">
      <div class="config-title">Perfil</div>
      <div class="profile-row">
        <div class="profile-avatar">${userInitial}</div>
        <div><div style="color:#FFF;font-size:15px;font-weight:700;">${userName}</div>
        <div style="color:#555;font-size:12px;margin-top:2px;">${USER?.email??''}</div></div>
      </div>
    </div>
    <div class="config-section">
      <div class="config-title">Seguridad</div>
      <div class="field"><label>Nueva contraseña</label><input type="password" id="np" placeholder="Mínimo 6 caracteres"/></div>
      <div class="field"><label>Confirmar contraseña</label><input type="password" id="cp" placeholder="Repite la contraseña"/></div>
      <div class="error-box" id="pass-err"></div>
      <div class="success-box" id="pass-ok">✓ Contraseña actualizada correctamente</div>
      <button class="btn btn-yellow" onclick="changePass()">Actualizar contraseña</button>
    </div>
    <div class="config-section">
      <div class="config-title">Métodos de pago</div>
      <div class="info-row"><span class="info-key">💳 Tarjeta de crédito / débito</span><span class="info-val" style="color:#555;font-size:11px;">Por pago</span></div>
      <div class="info-row" style="opacity:0.4"><span class="info-key">📱 NFC / Tap to Pay</span><span class="info-val" style="color:#555;font-size:11px;">Próximamente</span></div>
    </div>
    <button class="btn btn-red" onclick="signOut()">Cerrar sesión</button>`;
}

async function changePass(){
  const np=document.getElementById('np').value;
  const cp=document.getElementById('cp').value;
  const errEl=document.getElementById('pass-err');
  const okEl=document.getElementById('pass-ok');
  errEl.style.display='none';okEl.style.display='none';
  if(np.length<6){errEl.textContent='Mínimo 6 caracteres';errEl.style.display='block';return;}
  if(np!==cp){errEl.textContent='Las contraseñas no coinciden';errEl.style.display='block';return;}
  const res=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SESSION.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({password:np})});
  if(res.ok){okEl.style.display='block';document.getElementById('np').value='';document.getElementById('cp').value='';}
  else{const d=await res.json();errEl.textContent=d.message??'Error';errEl.style.display='block';}
}

function signOut(){localStorage.removeItem('parkea_session');window.location.href='index.html';}

// Init
loadHome();
</script>
